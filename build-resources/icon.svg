  <!-- sphere volume + specular, over the winding -->
  <circle cx="512" cy="474" r="238" fill="url(#volume)"/>
  <ellipse cx="416" cy="362" rx="104" ry="74"
           transform="rotate(-28 416 362)" fill="url(#spec)"/>

  <!-- the firm outline that keeps it cartoon, and legible at 16px -->
  <circle cx="512" cy="474" r="238" fill="none" stroke="#1c1036"
          stroke-width="11" opacity="0.85"/>

  <!-- the trailing thread, paying out to a loose loop -->
  <g fill="none" stroke-linecap="round">
    <path d="M 690 646 C 806 716 852 766 812 818 C 774 866 686 856 666 806 C 648 762 692 736 730 754 C 774 774 800 812 856 822" stroke="#2a1a4e" stroke-width="30" opacity="0.45"/>
